<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Ramires Matias</title><desc id="d">Desenvolvedor full stack. TypeScript do front ao back. Diagrama animado de um sistema: web, api, broker, banco e cache trocando mensagens.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
<style>
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){.flow{animation:none} .pkt{display:none}}
</style></defs>
<rect width="1200" height="340" rx="14" fill="#0d1117"/>
<rect x="640" y="0" width="560" height="340" fill="url(#g)"/>
<text x="64" y="104" class="mono" font-size="16" fill="#3fb5cf">$ whoami</text>
<text x="62" y="168" class="sans" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">Ramires Matias</text>
<text x="64" y="208" class="sans" font-size="21" fill="#e6edf3">Desenvolvedor full stack · TypeScript do front ao back</text>
<text x="64" y="256" class="mono" font-size="15" fill="#8b949e"><tspan fill="#e3a33b">estudando</tspan> → microsserviços, eventos, DDD, hexagonal</text>
<text x="64" y="291" class="mono" font-size="15" fill="#3fb5cf">$</text>
<rect x="80" y="277" width="9" height="17" fill="#3fb5cf"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
<path id="p-web-api" d="M765 94 L925 174" stroke="#3fb5cf" stroke-opacity="0.85" stroke-width="1.5" fill="none" class="flow"/>
<text x="835" y="130" text-anchor="end" class="mono" font-size="11" fill="#8b949e">HTTP</text>
<circle class="pkt" r="4" fill="#3fb5cf"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p-web-api"/></animateMotion></circle>
<circle class="pkt" r="4" fill="#3fb5cf"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p-web-api"/></animateMotion></circle>
<path id="p-api-queue" d="M925 174 L1095 94" stroke="#e3a33b" stroke-opacity="0.85" stroke-width="1.5" fill="none" class="flow"/>
