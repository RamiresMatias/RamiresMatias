<path id="p-api-cache" d="M925 174 L765 254" stroke="#3fb5cf" stroke-opacity="0.85" stroke-width="1.5" fill="none" class="flow"/>
<text x="831" y="218" text-anchor="end" class="mono" font-size="11" fill="#8b949e">cache</text>
<circle class="pkt" r="4" fill="#3fb5cf"><animateMotion dur="3.2s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p-api-cache"/></animateMotion></circle>
