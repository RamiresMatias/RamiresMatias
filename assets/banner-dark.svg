<circle class="pkt" r="4" fill="#e3a33b"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p-api-queue"/></animateMotion></circle>
<path id="p-queue-db" d="M1095 94 L1095 254" stroke="#e3a33b" stroke-opacity="0.85" stroke-width="1.5" fill="none" class="flow"/>
